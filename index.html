<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f5132">
  <meta name="description" content="Pengumuman, jadwal mengajar, kitab & materi di Dayah Babussa'adah">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>Dayah Babussa'adah</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="beranda">
  <!-- Teks berjalan (pengumuman singkat) -->
  <div class="teks-berjalan" id="teksBerjalan" hidden><div class="jalur" id="jalurBerjalan"></div></div>

  <div class="beranda-wrap">
    <!-- ================= KIRI: identitas + login ================= -->
    <aside class="beranda-kiri" id="panelKiri">
      <div class="kiri-isi">
        <div class="kiri-identitas">
          <div id="logoWrap" class="login-logo" title=""><span>☪</span></div>
          <div>
            <h2 id="namaDayah">Dayah Babussa'adah</h2>
            <p id="alamatDayah"></p>
            <p id="taglineDayah" class="tagline"></p>
          </div>
        </div>

        <!-- Sudah login -->
        <div class="kartu-login" id="sudahMasuk" hidden>
          <h1>Assalamu'alaikum</h1>
          <p class="sub" id="sudahMasukNama"></p>
          <a class="btn btn-blok" id="btnKeAplikasi" href="dashboard.html">Buka aplikasi →</a>
        </div>

        <!-- Login biasa: Teungku & pengurus -->
        <div class="kartu-login" id="kotakLogin">
          <h1 id="judulLogin">Masuk</h1>
          <p class="sub" id="subLogin">Untuk teungku & pengurus dayah</p>
          <div class="info" id="infoSetup" hidden>Aplikasi belum disiapkan. <a href="setup.html"><b>Setup awal →</b></a></div>
          <form id="formLogin" autocomplete="on">
            <div class="field">
              <label for="username">Username</label>
              <input id="username" name="username" required autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="mis. tgk.yusuf">
            </div>
            <div class="field">
              <label for="password">Kata sandi</label>
              <div class="sandi-wrap">
                <input type="password" id="password" name="password" required autocomplete="current-password">
                <button type="button" class="lihat" id="lihatSandi" aria-label="Lihat kata sandi">👁</button>
              </div>
            </div>
            <button class="btn btn-blok" type="submit" id="btnMasuk">Masuk</button>
            <div class="error" id="err"></div>
            <p class="kecil muted" style="text-align:center;margin:6px 0 0">Lupa kata sandi? Hubungi pengelola dayah.</p>
            <button type="button" class="btn btn-sm btn-sec btn-blok" id="btnBatalPengelola" hidden style="margin-top:8px">← Kembali ke login biasa</button>
          </form>
        </div>

        <button class="btn btn-emas tombol-pasang" id="btnPasang" hidden>⬇ Pasang aplikasi di HP / laptop</button>

        <div class="kiri-bawah" id="kakiKiri"></div>
      </div>
    </aside>

    <!-- ================= KANAN: pengumuman, jadwal, kitab (publik) ================= -->
    <main class="beranda-kanan">
      <section id="madingWrap" hidden>
        <h1>📌 Mading Dayah</h1>
        <div class="mading" id="mading"></div>
      </section>

      <div class="kanan-judul" style="margin-top:14px">
        <h1>Jadwal Mengajar & Kitab</h1>
        <div class="pub-sesi" id="pubSesi"></div>
      </div>

      <div class="pub-tab" role="tablist">
        <button class="aktif" data-tab="jadwal">📅 Per hari</button>
        <button data-tab="kitab">📖 Kitab & materi</button>
        <button data-tab="teungku">👤 Per teungku</button>
        <button data-tab="riwayat">🕘 Riwayat perubahan</button>
      </div>

      <section id="tab-jadwal">
        <div class="hari-pilih" id="hariPilih"></div>
        <div id="jadwalHari"><div class="card empty">Memuat jadwal...</div></div>
      </section>
      <section id="tab-kitab" hidden>
        <div class="card">
          <div class="field"><label>Cari kitab / materi / teungku</label><input id="cariKitab" placeholder="mis. Taqrib"></div>
          <div id="daftarKitab"></div>
        </div>
      </section>
      <section id="tab-teungku" hidden><div id="daftarTeungku"></div></section>
      <section id="tab-riwayat" hidden>
        <div class="card">
          <h2>Riwayat perubahan jadwal mengajar</h2>
          <ul class="riwayat" id="daftarRiwayat"><li class="empty">Memuat...</li></ul>
        </div>
      </section>
    </main>
  </div>

  <div class="modal" id="modalGambar"><div class="box" style="padding:8px;max-width:900px"><img id="gambarBesar" alt="" style="width:100%;border-radius:10px"></div></div>

  <script type="module" src="js/beranda.js"></script>
</body>
</html>
