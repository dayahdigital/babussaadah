<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setup Awal — Dayah Babussa'adah</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
  <div class="login-box">
    <div class="logo">☪</div>
    <h1>Setup Awal</h1>
    <p>Buat akun <b>Super Admin</b> pertama. Halaman ini hanya bisa dipakai sekali.</p>

    <div class="info" id="sudah" hidden>
      Setup sudah pernah dilakukan. <a href="index.html"><b>Ke halaman login →</b></a>
    </div>

    <form id="formSetup" hidden>
      <div class="field"><label>Nama lengkap</label><input name="nama" required></div>
      <div class="field">
        <label>Username</label>
        <input name="username" required autocapitalize="none" spellcheck="false" placeholder="mis. superadmin">
        <small style="color:#6b7770">3–20 karakter: huruf kecil, angka, titik, garis bawah.</small>
      </div>
      <div class="field"><label>Kata sandi</label><input type="password" name="password" minlength="6" required autocomplete="new-password"></div>
      <div class="field"><label>Ulangi kata sandi</label><input type="password" name="password2" minlength="6" required autocomplete="new-password"></div>
      <button class="btn" type="submit" id="btnBuat">Buat Super Admin</button>
      <div class="error" id="err"></div>
    </form>
  </div>
  <script type="module" src="js/setup.js"></script>
</body>
</html>
