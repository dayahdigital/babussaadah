<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f5132">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <title>Profil Dayah — Dayah Babussa'adah</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="navbar"></header>
  <main style="max-width:860px">
    <h1>Profil Dayah</h1>
    <form class="card" id="formLembaga">
      <h2>Identitas</h2>
      <div class="field"><label>Nama dayah</label><input name="nama" required maxlength="80"></div>
      <div class="field"><label>Alamat</label><input name="alamat" maxlength="160"></div>
      <div class="field"><label>Slogan / keterangan singkat (halaman depan)</label><input name="tagline" maxlength="120" placeholder="mis. Pondok Pesantren Salafiyah"></div>
      <div class="grid grid-2" style="margin-bottom:0">
        <div class="field"><label>Nama Pimpinan Dayah (tanda tangan laporan)</label><input name="pimpinan" maxlength="80"></div>
        <div class="field"><label>Nama Bendahara (tanda tangan slip & kas)</label><input name="bendahara" maxlength="80"></div>
      </div>

      <h2 style="margin-top:12px">Logo</h2>
      <div class="unggah">
        <div class="pratinjau-logo" id="pvLogo"><span>☪</span></div>
        <div><input type="file" id="fileLogo" accept="image/*"><small class="muted">Sebaiknya persegi. Otomatis diperkecil. Dipakai juga di kop laporan PDF.</small>
          <button type="button" class="btn btn-sm btn-sec" id="hapusLogo">Hapus logo</button></div>
      </div>

      <h2 style="margin-top:16px">Foto dayah (latar bilah kiri halaman depan)</h2>
      <div class="pratinjau-foto" id="pvFoto"></div>
      <div class="unggah" style="margin-top:8px"><div><input type="file" id="fileFoto" accept="image/*">
        <button type="button" class="btn btn-sm btn-sec" id="hapusFoto">Hapus foto</button></div></div>

      <div style="margin-top:18px"><button class="btn" type="submit" id="btnSimpan">Simpan</button></div>
    </form>
  </main>
  <script type="module" src="js/lembaga.js"></script>
</body>
</html>
