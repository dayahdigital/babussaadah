<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f5132">
  <title>Profil Dayah — Dayah Babussa'adah</title>
  <link rel="stylesheet" href="css/style.css?v=2.0.2">
</head>
<body>
  <header id="navbar"></header>
  <main>
    <h1>Profil Dayah</h1>

    <div class="grid grid-2">
      <form class="card" id="formLembaga">
        <h2>Identitas</h2>
        <div class="field"><label>Nama dayah</label><input name="nama" required></div>
        <div class="field"><label>Alamat</label><input name="alamat"></div>
        <div class="field"><label>Slogan / keterangan singkat (tampil di halaman login)</label><input name="tagline" placeholder="mis. Pondok Pesantren Salafiyah"></div>
        <div class="field"><label>Nama bendahara (tanda tangan slip gaji)</label><input name="bendahara"></div>

        <h2 style="margin-top:18px">Logo</h2>
        <div class="unggah">
          <div class="pratinjau-logo" id="pvLogo"><span>☪</span></div>
          <div>
            <input type="file" id="fileLogo" accept="image/*">
            <small>Sebaiknya persegi. Otomatis diperkecil.</small>
            <button type="button" class="btn btn-sm btn-sec" id="hapusLogo">Hapus logo</button>
          </div>
        </div>

        <h2 style="margin-top:18px">Foto dayah (bilah kiri halaman login)</h2>
        <div class="unggah">
          <div>
            <input type="file" id="fileFoto" accept="image/*">
            <small>Foto gedung, santri, atau suasana dayah. Otomatis diperkecil.</small>
            <button type="button" class="btn btn-sm btn-sec" id="hapusFoto">Hapus foto</button>
          </div>
        </div>

        <div style="margin-top:18px"><button class="btn" type="submit" id="btnSimpan">Simpan</button></div>
      </form>

      <div class="card">
        <h2>Pratinjau halaman login</h2>
        <div class="pratinjau-login">
          <div class="login-foto" id="pvFoto">
            <div class="login-foto-isi">
              <div class="login-logo" id="pvLogo2"><span>☪</span></div>
              <h2 id="pvNama"></h2>
              <p id="pvAlamat"></p>
              <p class="tagline" id="pvTagline"></p>
            </div>
          </div>
          <div class="pv-form"><b>Masuk</b><div></div><div></div><div class="pv-btn"></div></div>
        </div>
      </div>
    </div>
  </main>
  <script type="module" src="js/lembaga.js?v=2.0.2"></script>
</body>
</html>
