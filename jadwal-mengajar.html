<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f5132">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <title>Jadwal Mengajar — Dayah Babussa'adah</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="navbar"></header>
  <main style="max-width:920px">
    <h1>Jadwal Mengajar</h1>

    <div class="card">
      <div class="toolbar" id="pilihGuruWrap" hidden>
        <div class="field"><label>Teungku</label><select id="pilihGuru"></select></div>
        <button class="btn btn-sec" id="btnPdf" data-roles="superadmin,admin">📄 PDF semua jadwal</button>
        <button class="btn btn-sec" id="btnExcel" data-roles="superadmin,admin">📊 Excel</button>
      </div>
      <p id="keterangan" class="kecil muted" style="margin:8px 0 0"></p>
    </div>

    <div class="card">
      <h2 id="judulJadwal">Jadwal per minggu</h2>
      <div class="table-wrap">
        <table class="tabel-jadwal">
          <thead><tr><th>Hari</th><th id="thPagi">Pagi</th><th id="thMalam">Malam</th></tr></thead>
          <tbody id="tbJadwal"><tr><td colspan="3" class="empty">Memuat...</td></tr></tbody>
        </table>
      </div>
      <p class="kecil muted" style="margin-bottom:0">Jadwal menentukan sesi yang bisa diabsen, dan tampil untuk umum di halaman depan
        (nama teungku, kitab, materi, kelas — tanpa data mukafaah). Setiap perubahan tercatat di riwayat.</p>
    </div>

    <div class="card">
      <h2>🕘 Riwayat perubahan</h2>
      <ul class="riwayat" id="daftarRiwayat"><li class="empty">Memuat...</li></ul>
    </div>
  </main>

  <div class="modal" id="modal">
    <form class="box" id="formJadwal">
      <h2 id="judulModal">Jadwal</h2>
      <div class="field">
        <label>Kitab yang diajarkan</label>
        <input name="kitab" required maxlength="120" list="daftarKitab" placeholder="mis. Matan Taqrib, Jurumiyah">
        <datalist id="daftarKitab"></datalist>
      </div>
      <div class="field"><label>Materi / bab</label><input name="materi" maxlength="200" placeholder="mis. Bab Thaharah"></div>
      <div class="field"><label>Kelas / tingkat / tempat</label><input name="kelas" maxlength="80" placeholder="mis. Kelas 2 Ula, Balee 3"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-red" id="btnHapus" style="margin-right:auto">Hapus</button>
        <button type="button" class="btn btn-sec" id="btnBatal">Batal</button>
        <button type="submit" class="btn" id="btnSimpan">Simpan</button>
      </div>
    </form>
  </div>
  <script type="module" src="js/jadwal-mengajar.js"></script>
</body>
</html>
