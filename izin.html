<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f5132">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <title>Izin & Sakit — Dayah Babussa'adah</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="navbar"></header>
  <main style="max-width:860px">
    <h1>Persetujuan Izin & Sakit</h1>
    <div class="grid grid-3">
      <div class="card stat saldo"><div class="bulat">⏳</div><div><div class="label">Menunggu</div><div class="value" id="sMenunggu">–</div></div></div>
      <div class="card stat"><div class="bulat">✔</div><div><div class="label">Disetujui bulan ini</div><div class="value" id="sSetuju">–</div></div></div>
      <div class="card stat out"><div class="bulat">✖</div><div><div class="label">Ditolak bulan ini</div><div class="value" id="sTolak">–</div></div></div>
    </div>
    <div class="card">
      <div class="card-judul"><h2>Menunggu persetujuan</h2></div>
      <div id="daftarMenunggu"><p class="empty">Memuat...</p></div>
    </div>
    <div class="card">
      <div class="card-judul"><h2>Riwayat keputusan</h2></div>
      <div id="daftarRiwayat"></div>
    </div>
  </main>
  <div class="modal" id="modalGambar"><div class="box" style="padding:8px;max-width:800px"><img id="gambarBesar" alt="" style="width:100%"></div></div>
  <script type="module" src="js/izin.js"></script>
</body>
</html>
