# Deploy otomatis ke GitHub Pages + nomor build otomatis.
# Aktifkan: Settings > Pages > Source: "GitHub Actions".
# Config Firebase: dari Secret "FIREBASE_CONFIG" bila ada; kalau tidak, memakai js/firebase-config.js di repo.
name: Deploy ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Siapkan js/firebase-config.js
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: |
          if [ -n "$FIREBASE_CONFIG" ]; then
            node -e '
              const c = JSON.parse(process.env.FIREBASE_CONFIG);
              for (const k of ["apiKey","authDomain","projectId","appId"])
                if (!c[k]) { console.error("::error::FIREBASE_CONFIG tidak punya " + k); process.exit(1); }
              require("fs").writeFileSync("js/firebase-config.js", "export const firebaseConfig = " + JSON.stringify(c, null, 2) + ";\n");
            '
            echo "Config dari Secret."
          elif [ -f js/firebase-config.js ]; then
            echo "Secret kosong — memakai js/firebase-config.js dari repo."
          else
            echo "::error::Tidak ada config Firebase. Isi Secret FIREBASE_CONFIG atau unggah js/firebase-config.js"
            exit 1
          fi

      - name: Nomor build otomatis
        run: |
          B="${GITHUB_RUN_NUMBER}"
          sed -i "s/__BUILD__/${B}/" js/pengaturan.js sw.js
          grep -n "APP_BUILD" js/pengaturan.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
